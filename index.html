<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A little surprise 🤍</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 16px;
    display: grid; place-items: center;
    background: #f5eee6;
    font-family: Georgia, serif;
  }
  .card {
    width: min(100%, 440px);
    background: #fffaf4;
    border: 6px solid #171311;
    border-radius: 17px;
    padding: 12px;
    text-align: center;
    box-shadow: 0 10px 28px #00000018;
  }
  .front-image {
    display: block; width: 100%; height: auto;
    border-radius: 3px;
  }
  .tap-btn {
    margin: 16px 0 10px;
    border: 2px solid #873f25;
    border-radius: 999px;
    background: #f8dfd5;
    color: #873f25;
    padding: 14px 34px;
    font: bold 21px Georgia, serif;
    cursor: pointer;
    animation: bounce 1.25s ease-in-out infinite;
    box-shadow: 0 5px 0 #873f2530;
  }
  .tap-btn:active { transform: scale(.94); animation: none; }
  .tiny { color: #a16b55; font-size: 14px; margin: 3px 0 8px; }
  #reveal { display: none; animation: reveal .8s ease both; }
  #reveal img {
    width: 100%; height: auto; display: block;
    border-radius: 4px; margin: 5px auto 12px;
  }
  .message {
    color: #873f25; font-size: clamp(22px, 6vw, 29px);
    line-height: 1.45; font-style: italic; margin: 14px 5px;
  }
  .music-label { color: #873f25; font-size: 18px; margin: 10px 0; }
  audio { width: 100%; margin: 8px 0 12px; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    45% { transform: translateY(-8px); }
    65% { transform: translateY(0); }
    80% { transform: translateY(-3px); }
  }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(15px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
</style>
</head>
<body>
  <main class="card">
    <section id="front">
      <img class="front-image" src="assets/front-page.png" alt="Kabhi has bhi liya karo ji">
      <button class="tap-btn" id="tapButton">Tap here 🤍</button>
      <p class="tiny">Bas ek tap… 👀</p>
    </section>

    <section id="reveal">
      <img src="assets/surprise-photo.png" alt="Good morning surprise">
      <div class="message">Hehe… Good morning, Kriy ansh! ☀️<br>Ab toh has do ji 🤍</div>
      <div class="music-label">♫ A little song for you ♡</div>
      <audio id="song" src="assets/happy-diwali.mp3" loop controls></audio>
    </section>
  </main>

<script>
  const tapButton = document.getElementById("tapButton");
  const front = document.getElementById("front");
  const reveal = document.getElementById("reveal");
  const song = document.getElementById("song");

  // A tiny, gentle pop/boing sound made in-browser (no extra sound file needed).
  function playTapSound() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(620, ctx.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(360, ctx.currentTime + 0.09);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.14);
      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start();
      oscillator.stop(ctx.currentTime + 0.15);
      oscillator.onended = () => ctx.close();
    } catch (e) {}
  }

  tapButton.addEventListener("click", async () => {
    playTapSound();
    front.style.display = "none";
    reveal.style.display = "block";
    try {
      await song.play();
    } catch (e) {
      // The music controls remain visible if the browser blocks autoplay.
    }
  });
</script>
</body>
</html>
