
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Surprise ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f5eee6;
  font-family: Georgia, serif;
}

.card {
  width: 100%;
  max-width: 440px;
  padding: 12px;
  background: #fffaf4;
  border: 6px solid #171311;
  border-radius: 20px;
  text-align: center;
}

.photo {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 5px;
}

.tap-button {
  display: inline-block;
  margin: 18px 0;
  padding: 14px 32px;
  border: 2px solid #873f25;
  border-radius: 50px;
  background: #f8dfd5;
  color: #873f25;
  font-size: 22px;
  font-weight: bold;
  font-family: Georgia, serif;
  cursor: pointer;
  animation: bounce 1.2s infinite;
}

.tap-button:active {
  transform: scale(0.92);
}

.hint {
  color: #a16b55;
  font-size: 16px;
}

#surprise {
  display: none;
}

#surprise.show {
  display: block;
  animation: appear 1s ease;
}

.message {
  color: #873f25;
  font-size: 25px;
  line-height: 1.5;
  margin: 18px 5px;
}

.music-text {
  color: #873f25;
  font-size: 18px;
}

audio {
  width: 100%;
  margin: 12px 0;
}

@keyframes bounce {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-8px);
  }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="card">

  <!-- FRONT PAGE -->
  <div id="front">

    <img
      class="photo"
      src="./front-page.png"
      alt="Kabhi has bhi liya karo ji"
    >

    <button class="tap-button" id="tapButton">
      Tap here 🤍
    </button>

    <p class="hint">Bas ek tap... 👀</p>

  </div>

  <!-- SURPRISE PHOTO AND SONG -->
  <div id="surprise">

    <img
      class="photo"
      src="./surprise-photo.png"
      alt="Good morning surprise"
    >

    <div class="message">
      Hehe... Good morning Kriy ansh! ☀️<br>
      Ab toh has do ji 🤍
    </div>

    <p class="music-text">
      ♫ A little song for you ♡
    </p>

    <audio id="song" src="./happy-diwali.mp3" loop controls>
    </audio>

  </div>

</div>

<script>

const button = document.getElementById("tapButton");
const front = document.getElementById("front");
const surprise = document.getElementById("surprise");
const song = document.getElementById("song");

// Cute little pop sound
function playPop() {
  try {
    const AudioContext =
      window.AudioContext || window.webkitAudioContext;

    const context = new AudioContext();
    const oscillator = context.createOscillator();
    const volume = context.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(
      600, context.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
      300, context.currentTime + 0.12
    );

    volume.gain.setValueAtTime(
      0.15, context.currentTime
    );

    volume.gain.exponentialRampToValueAtTime(
      0.001, context.currentTime + 0.15
    );

    oscillator.connect(volume);
    volume.connect(context.destination);

    oscillator.start();
    oscillator.stop(context.currentTime + 0.15);

  } catch (error) {
    console.log("Sound effect unavailable");
  }
}

// Button click
button.addEventListener("click", async function() {

  playPop();

  front.style.display = "none";

  surprise.classList.add("show");

  try {
    await song.play();
  } catch (error) {
    // If autoplay is blocked, use the song player.
  }

});

</script>

</body>
</html>
